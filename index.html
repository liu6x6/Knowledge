<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Knowledge 网页索引">
    <title>Knowledge · 网页索引</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f7f8fa;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --link: #2563eb;
            --border: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #111827;
                --card: #1f2937;
                --text: #f9fafb;
                --muted: #9ca3af;
                --link: #93c5fd;
                --border: #374151;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 64px 24px;
            background: var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
        }

        .subtitle {
            margin: 8px 0 32px;
            color: var(--muted);
        }

        #pages {
            display: grid;
            gap: 12px;
            padding: 0;
            list-style: none;
        }

        #pages a {
            display: block;
            padding: 18px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--link);
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        #pages a:hover,
        #pages a:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgb(0 0 0 / 12%);
        }

        #status {
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <h1>Knowledge</h1>
        <p class="subtitle">仓库中的 HTML 与 Markdown 网页目录</p>
        <p id="status" role="status">正在加载网页列表…</p>
        <ul id="pages"></ul>
    </main>

    <script>
        const owner = "liu6x6";
        const repository = "Knowledge";
        const branch = "main";
        const pagesElement = document.querySelector("#pages");
        const statusElement = document.querySelector("#status");

        function pageURL(path) {
            return path.split("/").map(encodeURIComponent).join("/");
        }

        function displayName(path) {
            return path.replace(/\.(html?|md)$/i, "").replaceAll("-", " ");
        }

        function publishedPath(path) {
            return path.replace(/\.md$/i, ".html");
        }

        async function loadPages() {
            const response = await fetch(
                `https://api.github.com/repos/${owner}/${repository}/git/trees/${branch}?recursive=1`,
                { headers: { Accept: "application/vnd.github+json" } }
            );

            if (!response.ok) {
                throw new Error(`GitHub API 返回 ${response.status}`);
            }

            const { tree, truncated } = await response.json();
            if (truncated) {
                throw new Error("仓库文件过多，无法完成索引");
            }

            const pageByURL = tree
                .filter(({ type, path }) => type === "blob" && /\.(html?|md)$/i.test(path))
                .filter(({ path }) => path !== "index.html" && path !== "index.md")
                .map(({ path }) => ({ path, url: publishedPath(path) }))
                .reduce((pages, page) => {
                    if (!pages.has(page.url) || /\.html?$/i.test(page.path)) {
                        pages.set(page.url, page);
                    }
                    return pages;
                }, new Map());
            const pages = [...pageByURL.values()]
                .sort((first, second) => first.path.localeCompare(second.path, "zh-CN"));

            if (pages.length === 0) {
                statusElement.textContent = "暂时还没有可浏览的网页。";
                return;
            }

            for (const { path, url } of pages) {
                const item = document.createElement("li");
                const link = document.createElement("a");
                link.href = pageURL(url);
                link.textContent = displayName(path);
                item.append(link);
                pagesElement.append(item);
            }

            statusElement.textContent = `共发现 ${pages.length} 个网页。`;
        }

        loadPages().catch((error) => {
            console.error("无法加载网页索引：", error);
            statusElement.textContent = "暂时无法加载网页目录，请稍后刷新重试。";
        });
    </script>
</body>
</html>
